# Builds the Windows app for pull requests, and on demand (Actions tab > Build > Run workflow). Not on plain pushes:
# a build takes ~12 minutes.
# Download the result from the run's page under "Artifacts".
#
# Note: library/default/ (the default asset library, built locally from MLNZ Park) is not in git, so the CI build
# ships with the placeholder features only.
name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      # type-checks and builds the UI, compiles the Rust app, and makes the installer (NSIS)
      - run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: jibbers-map-studio-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # the bare app too (it finds the asset library only when installed, so prefer the installer)
      - uses: actions/upload-artifact@v5
        with:
          name: jibbers-map-studio-exe
          path: src-tauri/target/release/jibbers-studio.exe
          if-no-files-found: error
