[package]
name = "gamelink"
description = "Jibbers Studio's link into the game: loaded into Jibbers by the studio's Play, it starts the map straight away and runs the game inside the studio's Game tab"
version = "0.1.0"
edition.workspace = true

[lib]
name = "jibbers_link"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Security"] }

